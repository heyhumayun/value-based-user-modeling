[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-based-user-modeling"
version = "0.1.0"
description = "PyTorch value-based user modeling for synthetic OTT interactions."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
